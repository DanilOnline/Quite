name: Quiet
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    APP_GROUP: group.com.example.quiet
    CODE_SIGN_STYLE: Automatic
targets:
  Quiet:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quiet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Quiet
        SharedAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.example.quiet
            CFBundleURLSchemes: [quiet]
    entitlements:
      path: App/Quiet.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    dependencies:
      - target: QuietWidget
  QuietWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quiet.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Quiet
        SharedAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/QuietWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
schemes:
  Quiet:
    build:
      targets:
        Quiet: all
    run:
      config: Debug
    archive:
      config: Release
